schema: bobsim.ymd.v1

vehicle_template: ../../vehicle.yml

generation:
  speed_mps: 15.0
  beta_min_deg: -8.0
  beta_max_deg: 8.0
  beta_points: 61
  hwa_min_deg: -8.0
  hwa_max_deg: 8.0
  hwa_points: 61
  yaw_rate_radps: 0.0
  max_iter: 50
  tol_ay: 1.0e-5
  relaxation: 0.35
  warn_tire_load_range: true

speed_sweep:
  enabled: true
  speeds_mps: [10.0, 12.5, 15.0, 17.5, 20.0, 22.5, 25.0]

report:
  enabled: true
  brand: BobSim
  title: Yaw Moment Diagram Characterization
  subtitle: First-principles moment-method YMD, zero-yaw-moment trim curve, and lateral/yaw authority metrics
  output_path: ../results/ymd_report.pdf
  metrics_output_path: ../results/ymd_report_metrics.csv
  trim_output_path: ../Build/YMD/ymd_trim_curve.csv
  raw_output_path: ../Build/YMD/ymd_first_principles.csv
  notes:
    - YMD is generated from the reduced EnvelopeSim vehicle projection built from vehicle.yml.
    - Trim metrics come from interpolating the zero-yaw-moment condition across roadwheel-angle slices.
    - Peak lateral acceleration is the largest absolute converged ay point in the generated beta/roadwheel map.
    - This is a quasi-static moment-method map, not a full Modelica trim solve.
