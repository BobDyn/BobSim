schema: bobsim.ggv.v1

vehicle_template: ../../vehicle.yml

generation:
  speeds_mps: [5.0, 10.0, 15.0, 20.0, 25.0]
  ay_max_g: 4.5
  ay_points: 321
  ax_search_min_g: -3.2
  ax_search_max_g: 2.8
  ax_search_points: 801
  include_left_right: true
  warn_tire_load_range: true

report:
  enabled: true
  brand: BobSim
  title: GGV Envelope Characterization
  subtitle: First-principles quasi-static acceleration envelope, distance-integrated track-profile proxies, and tire-limited longitudinal capability
  output_path: ../results/ggv_report.pdf
  metrics_output_path: ../results/ggv_report_metrics.csv
  track_profile_output_path: ../Build/GGV/ggv_track_performance_profile.csv
  velocity_profile_output_path: ../Build/GGV/ggv_track_velocity_profile.csv
  raw_output_path: ../Build/GGV/ggv_first_principles.csv
  reference_speed_mps: 15.0
  notes:
    - GGV is generated from the reduced EnvelopeSim vehicle projection built from vehicle.yml.
    - Tire forces use load-sensitive peak friction terms and a simple combined-slip ellipse.
    - Track-profile scores are maneuver/path proxies, not laptime simulation.
    - Track-profile maneuvers approximate a released FSAE endurance layout as a representative yearly reference.
    - Corner maneuvers estimate sustainable speed from ay = V^2 / R.
    - Straight maneuvers integrate forward acceleration and backward braking over configured distances.

performance_index:
  track_profile:
    name: released_fsae_endurance_reference
    mode: path
    integration_step_m: 1.0
    combined_weights:
      lateral: 0.60
      longitudinal: 0.40
    maneuvers:
      - name: front straight
