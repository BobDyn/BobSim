services:
  bobsim: &bobsim-base
    build:
      context: .
      dockerfile: Dockerfile
      # main publishes the image with its layer cache (.github/workflows/image.yml).
      # Unchanged layers come from there instead of rebuilding OpenModelica's
      # libraries; a changed Dockerfile or requirements.txt rebuilds from that
      # layer on. If the registry is unreachable the build runs from scratch.
      cache_from:
        - ghcr.io/bobdyn/bobsim:latest
    image: bobdyn/bobsim:latest
    volumes:
      - .:/workspace
    working_dir: /workspace
    network_mode: none
    environment:
      PYTHONPATH: /workspace
    stdin_open: true
    tty: true

  standard:
    <<: *bobsim-base
    working_dir: /workspace/simulations/response/mbd

  envelope:
    <<: *bobsim-base
    working_dir: /workspace/simulations/envelope

  opt:
    <<: *bobsim-base
    working_dir: /workspace/optimization

  app:
    <<: *bobsim-base
    network_mode: bridge
    init: true
    environment:
      PYTHONPATH: /workspace
      BOBSIM_OPENMODELICA_SETTINGS: openmodelica.docker.json
