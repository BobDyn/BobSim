schema: bobsim.envelope_sensitivities.v1

vehicle_template: ../../vehicle.yml
ggv_config: ../../_2_EnvelopeSim/GGV/ggv_config.yml

sampling:
  method: interval_splice
  intervals: 4

variables:
  # -------------------------------------------------------------------------
  # Mass properties
  # -------------------------------------------------------------------------
  - path: sprung_mass.mass_kg
    label: sprung mass
    range: [144.576, 176.704]

  - path: sprung_mass.cg_m.x
    label: sprung CG x
    range: [-0.97, -0.87]

  - path: sprung_mass.cg_m.z
    label: sprung CG z
    range: [0.20, 0.30]

  - path: driver_mass.mass_kg
    label: driver mass
    range: [59.193821, 72.348003]

  - path: driver_mass.cg_m.x
    label: driver CG x
    range: [-0.591837, -0.491837]

  - path: driver_mass.cg_m.z
    label: driver CG z
    range: [0.345782, 0.445782]

  - path: front.masses.unsprung.mass_kg
    label: front unsprung mass
    range: [6.258146248, 9.387219372]

  - path: rear.masses.unsprung.mass_kg
    label: rear unsprung mass
    range: [5.881760576, 8.822640864]

  # -------------------------------------------------------------------------
  # Load transfer proxy
  # -------------------------------------------------------------------------
  - path: front.stabar.rate_n_m_per_rad
    label: front anti-roll bar rate
    range: [205.376938, 295.74279]
    values: [205.376938, 231.500884, 276.68381, 295.74279]

  - path: rear.stabar.rate_n_m_per_rad
    label: rear anti-roll bar rate
    range: [360.052058, 961.495352]
    values: [360.052058, 447.762538, 748.484186, 961.495352]

  # -------------------------------------------------------------------------
  # Aero envelope controls
  # -------------------------------------------------------------------------
  - path: aero.downforce_scale
    label: aero downforce scale
    baseline: 1.0
    range: [0.5, 1.5]

  - path: aero.drag_scale
    label: aero drag scale
    baseline: 1.0
    range: [0.75, 1.25]

  - path: aero.balance_front
    label: aero front balance
    range: [0.45, 0.75]

  # -------------------------------------------------------------------------
  # Tire envelope controls
  # -------------------------------------------------------------------------
  - path: tire.mu_scale
    label: tire peak grip scale
    baseline: 1.0
    range: [0.85, 1.15]

  - path: tire.load_sensitivity_scale
    label: tire load sensitivity scale
    baseline: 1.0
    range: [0.5, 1.5]

  - path: tire.cornering_stiffness_scale
    label: tire cornering stiffness scale
    baseline: 1.0
    range: [0.8, 1.2]

  # -------------------------------------------------------------------------
  # Longitudinal envelope controls
  # -------------------------------------------------------------------------
  - path: power.max_drive_power_kw
    label: max drive power
    baseline: 80.0
    range: [60.0, 100.0]

  - path: brake.front_bias
    label: brake front bias
    baseline: 0.84
    range: [0.78, 0.90]

  # -------------------------------------------------------------------------
  # Architecture-level geometry controls
  # -------------------------------------------------------------------------
  - path: geometry.wheelbase_scale
    label: wheelbase scale
    baseline: 1.0
    range: [0.97, 1.03]

  - path: geometry.track_scale
    label: track scale
    baseline: 1.0
    range: [0.95, 1.05]
