# aggregator_config.yaml — defines which report metrics to extract per standard
#
# Each standard has its own steady_state_metrics block.
# key:   output column name in parquet
# value: exact metric name from the standard's metrics CSV
#
# To add a metric: add one line under the standard. Nothing else changes.
# To add a standard: add a new block. Nothing else changes.

standards:

  SteadyStateEval:
    steady_state_metrics:

      # --- Range summary ---
      ay_min:                               "ay_min"
      ay_max:                               "ay_max"

      # --- Steering gradients ---
      understeer_gradient_rad_per_mps2:     "understeer_gradient_rad_per_mps2"
      understeer_gradient_deg_per_g:        "understeer_gradient_deg_per_g"
      roadwheel_angle_gradient_rad_per_mps2: "roadwheel_angle_gradient_rad_per_mps2"
      roadwheel_angle_gradient_deg_per_g:    "roadwheel_angle_gradient_deg_per_g"
      handwheel_angle_gradient_rad_per_mps2: "handwheel_angle_gradient_rad_per_mps2"
      handwheel_angle_gradient_deg_per_g:    "handwheel_angle_gradient_deg_per_g"
      sideslip_gradient_rad_per_mps2:        "sideslip_gradient_rad_per_mps2"
      sideslip_gradient_deg_per_g:           "sideslip_gradient_deg_per_g"
      roll_gradient_deg_per_g:              "roll_gradient_deg_per_g"

      # --- Steering effort ---
      handwheel_torque_min:                 "handwheel_torque_min"
      handwheel_torque_max:                 "handwheel_torque_max"

      # --- Velocity sensitivity ---
      roadwheel_angle_gradient_velocity_slope_deg_per_g_per_mps: "roadwheel_angle_gradient_velocity_slope_deg_per_g_per_mps"
      handwheel_angle_gradient_velocity_slope_deg_per_g_per_mps: "handwheel_angle_gradient_velocity_slope_deg_per_g_per_mps"
      sideslip_gradient_velocity_slope_deg_per_g_per_mps:        "sideslip_gradient_velocity_slope_deg_per_g_per_mps"
      understeer_gradient_velocity_slope_deg_per_g_per_mps:      "understeer_gradient_velocity_slope_deg_per_g_per_mps"
      roll_gradient_velocity_slope_deg_per_g_per_mps:            "roll_gradient_velocity_slope_deg_per_g_per_mps"

  # KnC:
  #   steady_state_metrics:
  #     some_metric: "some.metric"
