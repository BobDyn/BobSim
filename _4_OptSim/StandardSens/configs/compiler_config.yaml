# DOE compiler configuration
# To add a new standard: uncomment or add a block under `standards`.
# No Python changes required.

boblib_path: ../../../_0_Utils/external/BobLib/BobLibVehicleInterfaces/package.mo

# Number of variants to compile in parallel.
# Each worker runs a separate OMC process.
# OMC itself is already multithreaded, so don't set this too high.
# 2-4 is a good starting point on a laptop, more on TACC.
max_workers: 8  # 8 for the Framework 16 goat

standards:
  SteadyStateEval:
    model: BobLibVehicleInterfaces.Experiments.Standards.VehicleSim
    # SteadyStateEval simulation settings live in:
    #   _3_StandardSim/SteadyStateEval/steady_state_eval_config.yml

  # KnC_Fr:
  #   model: BobLibVehicleInterfaces.Experiments.Standards.FourPostSim
  #   start_time: 0
  #   stop_time: 91
  #   intervals: 0
  #   tolerance: 1e-6
  #   solver: dassl

  # KnC_Rr:
  #   model: BobLibVehicleInterfaces.Experiments.Standards.FourPostSim
  #   start_time: 0
  #   stop_time: 91
  #   intervals: 0
  #   tolerance: 1e-6
  #   solver: dassl

# sim runner
batch:
  max_workers: 1
  timeout: 500
