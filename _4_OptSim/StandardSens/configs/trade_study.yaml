# A trade study: named vehicles compared across the standard sims.
#
#   make opt-trade
#   make opt-trade STUDY=path/to/another_study.yaml
#
# See docs/doe-reverse-engineering.md. Copy this file for each study; results land
# in _4_OptSim/results/trade/<name>.md and .csv.
name: rear_roll_stiffness

# Each candidate is the baseline vehicle with these variables changed. Any
# variable declared in vehicle_architecture.yaml may be used, mass and CG
# included, because every candidate is compiled rather than overridden. The
# baseline is always included and needs no entry.
#
# `both` makes exactly the changes of the other two, so the report also says
# whether those two changes stack or interact.
candidates:
  stiff_rear_bar:
    rear.stabar.rate_n_m_per_rad: 961.495352
  soft_front_spring:
    front.actuation.spring_rate_n_per_m: 21015.2202
  both:
    rear.stabar.rate_n_m_per_rad: 961.495352
    front.actuation.spring_rate_n_per_m: 21015.2202

# What to compare, per standard: SteadyStateEval, RampSteerEval or TransientEval.
# All three run against the one executable compiled for each candidate.
#
# `resolution` is the smallest change worth acting on. A smaller delta is still
# reported, marked `~`. Leave it off and the delta is reported unjudged. There is
# no score and no ranking: what a tenth of a degree of understeer is worth in
# settling time is your call, not the tool's.
metrics:
  SteadyStateEval:
    understeer_gradient_deg_per_g: {resolution: 0.02}
    roll_gradient_deg_per_g: {resolution: 0.02}
    peak_handwheel_torque_Nm: {resolution: 0.5}
  TransientEval:
    yaw_rise_time_s: {resolution: 0.005}
    yaw_overshoot_pct: {resolution: 1.0}
    roll_overshoot_pct: {resolution: 1.0}
    settling_time_s: {resolution: 0.05}

# Also render each standard's PDF report per vehicle. Worth having when the study
# goes in front of a design review; costs roughly ten seconds per run.
render_reports: true

# CPUs available to simulations (the Docker container's count, not the host's).
cpus: 12
