standard: SteadyStateEval

simulation:
  backend: modelica
  build_dir: _3_StandardSim/BuildBobLib/VehicleSim
  exec_name: BobLib.Experiments.Standards.VehicleSim

  start_time: 0.0
  stop_time: 45.0
  solver: dassl
  tolerance: 1e-6
  output_format: csv
  case_timeout_s: 420

  log_level: LOG_STATS
  extra_args:
    - -jacobian=internalNumerical
    - -ls=totalpivot

  no_grid: true
  no_event_emit: true

  # Explicit Modelica overrides used by closed-loop steady-state evaluation.
  init_parameters:
    useMode: 3
    steerStart: 2.0

    # Closed-loop lateral-acceleration target shaping and steering PI.
    steadyStateAyRampRate: 10.0
    steadyStateMaxHandwheel: 3.141592653589793
    steadyStateAyGain: 0.05
    steadyStateAyTi: 1.0
    steadyStateSteerTimeConstant: 0.15

    # Settled-point detection.
    steadyHoldDuration: 0.5
    steadyStateAyTolerance: 0.10
    steadyStateAyRateTolerance: 0.05
    steadyStateSpeedTolerance: 0.20
    steadyStateYawRateDerivativeTolerance: 0.01
    steadyStateSideslipRateTolerance: 0.005
    steadyStateRollRateTolerance: 0.005
    steadyStateSettleTimeout: 22.0
    linearitySlopeSamplePeriod: 0.10

    # Safety guards. Failed/unsettled points are skipped in the report.
    terminateOnTireLift: true
    tireLiftTerminateLoad: 75.0
    enableLinearityTermination: false
    enableNormalLoadSteerLimiter: false

    # Longitudinal velocity controller.
    velGain: 100.0
    velTi: 2.0

execution:
  parallel: true
  max_workers: 4
  cleanup: true
  stream_logs: false
  fail_fast: false

sweep:
  # Velocity isolines for steady-state lateral acceleration characterization.
  testVels: [12.5, 15.0, 17.5, 20.0]

  # Each target is driven by VehicleSim useMode=3 until steady conditions hold.
  targetAys: [2.0, 3.0, 4.0, 6.0, 8.0, 10.0, 12.0, 14.0, 16.0, 18.0]
  includeNegative: false

fit:
  # Linear-region bound used for reported understeer/gradient fits.
  ay_linear_max: 4.0
  # Exclude the low-|measured a_y| region before analysis.
  ay_min_magnitude: 1.0
  # Endpoint sweeps are sparse, so use a light robust prefilter and smooth fit.
  hampel_window: 3
  hampel_nsigmas: 3.0
  spline_smoothing_fraction: 0.02
  fit_points_per_mps2: 20
  fit_min_points: 120
  nonlinearity_metric: handwheel
  nonlinearity_fraction: 0.20
  nonlinearity_reference_ay: 4.0
  nonlinearity_evaluation_ay_margin: 0.75

report:
  enabled: true
  raw_plots_only: true
  brand: BobSim
  title: Steady-State Vehicle Characterization
  subtitle: Settled measured-$a_y$ operating points from closed-loop target holds
  output_path: _3_StandardSim/results/steady_state_eval_report.pdf

  # CSV metrics are exported from the velocity nearest this target.
  metric_target_velocity_mps: 15.0

  notes:
    - "Closed-loop VehicleSim useMode=3 drives each requested target $a_y$"
    - "Only cases whose steady-state conditions are met are included in the report"
    - "Measured $a_y$ is the analysis axis"
    - "Metrics describe settled endpoints, not ramp-response transients"
    - "|measured $a_y$| < 1.0 m/s^2 is excluded; linear band = 1.0 to 4.0 m/s^2"
    - "Limit metrics use the smooth fitted curves at the first 20% local steering-gradient nonlinearity"
    - "If the fitted 20% threshold is not reached, limit metrics fall back to the largest settled fitted point"
    - "Tire-lift protection terminates if any tire falls below the configured normal-load threshold"


plots:
  raw_steering:
    layout: dual
    title: "Steady-State Steering Points vs Measured $a_y$"

    subplots:
      - title: "Roadwheel Angle $\\delta$"
        style: scatter
        alpha: 0.9
        markersize: 5
        linestyle: ":"
        linewidth: 1.0
        x:
          key: ay_measured_raw_isoline
          label: "Measured $a_y$ $(m/s^2)$"
        y:
          key: roadwheel_raw_isoline
          label: "$\\delta$ (deg)"
          scale: 57.3
        overlay:
          x:
            key: ay_measured_fit_isoline
          y:
            key: roadwheel_fit_isoline
            scale: 57.3
          style: line
          alpha: 0.85
          linewidth: 1.6
          match_color: true

      - title: "Handwheel Angle $\\delta_{sw}$"
        style: scatter
        alpha: 0.9
        markersize: 5
        linestyle: ":"
        linewidth: 1.0
        x:
          key: ay_measured_raw_isoline
          label: "Measured $a_y$ $(m/s^2)$"
        y:
          key: handwheel_raw_isoline
          label: "$\\delta_{sw}$ (deg)"
          scale: 57.3
        overlay:
          x:
            key: ay_measured_fit_isoline
          y:
            key: handwheel_fit_isoline
            scale: 57.3
          style: line
          alpha: 0.85
          linewidth: 1.6
          match_color: true

  raw_vehicle_states:
    layout: triple
    title: "Steady-State Vehicle States vs Measured $a_y$"

    subplots:
      - title: "Curvature $\\kappa$"
        style: scatter
        alpha: 0.9
        markersize: 5
        linestyle: ":"
        linewidth: 1.0
        x:
          key: ay_measured_raw_isoline
          label: "Measured $a_y$ $(m/s^2)$"
        y:
          key: curvature_raw_isoline
          label: "$\\kappa$ (1/m)"
        overlay:
          x:
            key: ay_measured_fit_isoline
          y:
            key: curvature_fit_isoline
          style: line
          alpha: 0.85
          linewidth: 1.6
          match_color: true

      - title: "Roll Angle $\\phi$"
        style: scatter
        alpha: 0.9
        markersize: 5
        linestyle: ":"
        linewidth: 1.0
        x:
          key: ay_measured_raw_isoline
          label: "Measured $a_y$ $(m/s^2)$"
        y:
          key: roll_raw_isoline
          label: "$\\phi$ (rad)"
        overlay:
          x:
            key: ay_measured_fit_isoline
          y:
            key: roll_fit_isoline
          style: line
          alpha: 0.85
          linewidth: 1.6
          match_color: true

      - title: "Sideslip $\\beta$"
        style: scatter
        alpha: 0.9
        markersize: 5
        linestyle: ":"
        linewidth: 1.0
        x:
          key: ay_measured_raw_isoline
          label: "Measured $a_y$ $(m/s^2)$"
        y:
          key: sideslip_raw_isoline
          label: "$\\beta$ (rad)"
        overlay:
          x:
            key: ay_measured_fit_isoline
          y:
            key: sideslip_fit_isoline
          style: line
          alpha: 0.85
          linewidth: 1.6
          match_color: true

  raw_steering_effort:
    layout: dual
    title: "Steady-State Steering Effort vs Measured $a_y$"

    subplots:
      - title: "Handwheel Torque $T_{sw}$"
        style: scatter
        alpha: 0.9
        markersize: 5
        linestyle: ":"
        linewidth: 1.0
        x:
          key: ay_measured_raw_isoline
          label: "Measured $a_y$ $(m/s^2)$"
        y:
          key: torque_raw_isoline
          label: "$T_{sw}$ (Nm)"
        overlay:
          x:
            key: ay_measured_fit_isoline
          y:
            key: torque_fit_isoline
          style: line
          alpha: 0.85
          linewidth: 1.6
          match_color: true

      - title: "Steer Excess $\\delta_{excess}$"
        style: scatter
        alpha: 0.9
        markersize: 5
        linestyle: ":"
        linewidth: 1.0
        x:
          key: ay_measured_raw_isoline
          label: "Measured $a_y$ $(m/s^2)$"
        y:
          key: steer_excess_raw_isoline
          label: "$\\delta_{excess}$ (rad)"
        overlay:
          x:
            key: ay_measured_fit_isoline
          y:
            key: steer_excess_fit_isoline
