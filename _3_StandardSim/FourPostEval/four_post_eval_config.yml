  lltd_roll:
    layout: single
    title: "Load-Transfer LLTD vs Roll: Measured vs Roll-Rate Distribution"
    xlim: [-1.0, 1.0]
    x: { key: lltd_vs_roll_x, scale: 57.2958, label: "Roll (deg)" }
    y: { key: lltd_contact_force_vs_roll, scale: 100.0, label: "LLTD Front (%)" }
    label: "Measured baseline-delta load transfer"
    overlay:
      - x: { key: lltd_vs_roll_x, scale: 57.2958, label: "Roll (deg)" }
        y: { key: lltd_stiffness_vs_roll, scale: 100.0, label: "LLTD Front (%)" }
        label: "Hand calc roll-rate distribution"
        color: "black"
        linestyle: "--"
        linewidth: 2
    reference:
      - { type: horizontal, y: 50.0, label: "Neutral (50/50)" }
      - { type: horizontal, y: 60.0, color: "red", label: "Front Biased" }
      - { type: horizontal, y: 40.0, color: "green", label: "Rear Biased" }
