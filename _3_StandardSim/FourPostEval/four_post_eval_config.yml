  fbrc_roll:
    layout: dual
    title: "FBRC-Equivalent Height vs Roll (Loaded Contact Patches Only)"
    subplots:
      - { title: "Front", x: { key: fr_fbrc_vs_roll_x, scale: 57.2958, label: "Roll (deg)" }, y: { key: fr_fbrc_height_vs_roll, scale: 1000.0, label: "FBRC-equivalent height (mm)" } }
