  # contact_patch_force_roll:
  #   layout: quad
  #   title: "Contact Patch Fz vs Roll"
  #   subplots:
  #     - { title: "Front Left",  x: { key: roll, scale: 57.2958, label: "Roll (deg)" }, y: { key: fr_l_fz_vs_roll, label: "Fz (N)" } }
