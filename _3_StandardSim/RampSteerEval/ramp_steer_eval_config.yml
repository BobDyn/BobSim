standard: RampSteerEval

simulation:
  backend: modelica
  build_dir: _3_StandardSim/Build/VehicleSim
  exec_name: BobLibVehicleInterfaces.Experiments.Standards.VehicleSim

  start_time: 0.0
  stop_time: 45.0
  solver: dassl
  tolerance: 1e-6
  output_format: csv

  log_level: LOG_STATS
  extra_args:
    - -jacobian=internalNumerical
    - -ls=totalpivot

  no_grid: true
  no_event_emit: true

  # Explicit Modelica overrides used by RampSteerEval.
  init_parameters:
    # VehicleSim defaults to useMode=0. Leave that default in place rather than
    # overriding zero, which can make OpenModelica's initialization more fragile.
    steerStart: 2.0
    # Slow enough to reduce transient ramp loading while still reaching the
    # representative nonlinear shoulder before termination.
    handwheelRampRate: 0.06

    # Linearity termination owns the useful-limit detection for this study.
    enableNormalLoadSteerLimiter: false

    # Safety guard only; this should not define the reported limit metrics.
    terminateOnTireLift: true
    tireLiftTerminateLoad: 75.0

    enableLinearityTermination: true
    linearityNonlinearityFraction: 0.20
    linearityReferenceAy: 4.0
    linearityEvaluationAyMargin: 0.75
    linearitySlopeSamplePeriod: 0.20
    linearityHoldDuration: 0.05

    # Longitudinal velocity controller
    # Tuned for a faster, still-stable open-loop ramp response.
    velGain: 100.0
    velTi: 2.0

execution:
  parallel: true
  max_workers: 4
  cleanup: true
  stream_logs: false
  fail_fast: true

sweep:
  # Velocity isolines used for the open-loop ramp-steer characterization.
  testVels: [12.5, 15.0, 17.5, 20]

  # Only the positive ramp is generated by default; the negative branch is
  # symmetric and omitted to reduce runtime.
  maxAy: 18.0

fit:
  # Linear-region bound used for reported understeer/gradient fits.
  ay_linear_max: 4.0
  # Exclude the low-|measured a_y| region before analysis.
  ay_min_magnitude: 1.0
  # Robust prefilter applied before the smoothing spline fit.
  hampel_window: 51
  hampel_nsigmas: 3.0
  # Keep enough smoothing to avoid exact-spline amplification of transient ramp noise.
  spline_smoothing_fraction: 0.04

report:
  enabled: true
  raw_plots_only: true
  brand: BobSim
  title: Ramp-Steer Vehicle Characterization
  subtitle: Measured-$a_y$ ramp-response isolines with robust metric fits
  output_path: _3_StandardSim/results/ramp_steer_eval_report.pdf

  # CSV metrics are exported from the velocity nearest this target.
  metric_target_velocity_mps: 15.0

  notes:
    - "Open-loop constant-rate handwheel ramp at the configured test velocities"
    - "steerStart = 2.0 s; trim all pre-ramp samples"
    - "Measured $a_y$ is the analysis axis"
    - "Metrics describe the ramp-response path, not fully settled equilibrium holds"
    - "|measured $a_y$| < 1.0 m/s^2 is excluded; linear band = 1.0 to 4.0 m/s^2"
    - "Ramp terminates when local lateral gain drops 20% from the linear reference"
    - "Limit metrics are local derivatives at the largest measured |a_y| reached"
    - "Tire-lift protection terminates if any tire falls below the configured normal-load threshold"
    - "Raw plots are rendered; summary metrics use robust smoothed derivatives"


plots:
  raw_steering:
    layout: dual
    title: "Raw Steering Samples vs Measured $a_y$"

    subplots:
      - title: "Roadwheel Angle $\\delta$"
        style: line
        alpha: 0.85
        linewidth: 1.2
        x:
          key: ay_measured_raw_isoline
          label: "Measured $a_y$ $(m/s^2)$"
        y:
          key: roadwheel_raw_isoline
          label: "$\\delta$ (deg)"
          scale: 57.3

      - title: "Handwheel Angle $\\delta_{sw}$"
        style: line
        alpha: 0.85
        linewidth: 1.2
        x:
          key: ay_measured_raw_isoline
          label: "Measured $a_y$ $(m/s^2)$"
        y:
          key: handwheel_raw_isoline
          label: "$\\delta_{sw}$ (deg)"
          scale: 57.3

  raw_vehicle_states:
    layout: triple
    title: "Raw Vehicle State Samples vs Measured $a_y$"

    subplots:
      - title: "Curvature $\\kappa$"
        style: line
        alpha: 0.85
        linewidth: 1.2
        x:
          key: ay_measured_raw_isoline
          label: "Measured $a_y$ $(m/s^2)$"
        y:
          key: curvature_raw_isoline
          label: "$\\kappa$ (1/m)"

      - title: "Roll Angle $\\phi$"
        style: line
        alpha: 0.85
        linewidth: 1.2
        x:
          key: ay_measured_raw_isoline
          label: "Measured $a_y$ $(m/s^2)$"
        y:
          key: roll_raw_isoline
          label: "$\\phi$ (rad)"

      - title: "Sideslip $\\beta$"
        style: line
        alpha: 0.85
        linewidth: 1.2
        x:
          key: ay_measured_raw_isoline
          label: "Measured $a_y$ $(m/s^2)$"
        y:
          key: sideslip_raw_isoline
          label: "$\\beta$ (rad)"

  raw_steering_effort:
    layout: dual
    title: "Raw Steering Effort Samples vs Measured $a_y$"

    subplots:
      - title: "Steering Torque $T_{sw}$"
        style: line
        alpha: 0.85
        linewidth: 1.2
        x:
          key: ay_measured_raw_isoline
          label: "Measured $a_y$ $(m/s^2)$"
        y:
          key: torque_raw_isoline
          label: "$T_{sw}$ (Nm)"

      - title: "Steer Excess $\\delta_{excess}$"
        style: line
        alpha: 0.85
        linewidth: 1.2
        x:
          key: ay_measured_raw_isoline
          label: "Measured $a_y$ $(m/s^2)$"
        y:
          key: steer_excess_raw_isoline
          label: "$\\delta_{excess}$ (rad)"
