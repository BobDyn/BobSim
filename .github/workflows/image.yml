name: Image

# Publishes the BobSim dev image so `make docker-build`, CI's container job and
# lhre's FourPost job reuse its layers instead of rebuilding them. The image
# carries its own layer cache (inline), which is what docker-compose.yml's
# cache_from reads, so a build with an unchanged Dockerfile is a download.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - requirements.txt
      - .github/workflows/image.yml

concurrency:
  group: image
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish image
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/bobdyn/bobsim:latest
            ghcr.io/bobdyn/bobsim:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=registry,ref=ghcr.io/bobdyn/bobsim:latest
          cache-to: type=inline
