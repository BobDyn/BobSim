name: Regression Baseline

# Manual only because the full baseline is slow. A person reviews the uploaded reports (CONTRIBUTING.md).
on:
  workflow_dispatch:
    inputs:
      runner:
        description: Runner label. Hosted runners are small; use a self-hosted label if cases time out.
        required: false
        default: ubuntu-latest
        type: string

concurrency:
  group: regression-baseline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    name: Full StandardSim baseline
    runs-on: ${{ inputs.runner }}
    # A 16-core host takes 10-13 min. Smaller runners take much longer.
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build BobSim image
        run: docker compose build bobsim

      - name: Verify OpenModelica toolchain
        run: docker compose run --rm -T bobsim omc --version

      # SteadyStateEval uses 8 workers. On small runners, case timeouts can look like physics failures.
      - name: Report available cores
        run: nproc

      - name: Run full regression baseline
        run: make regression-baseline

      - name: Upload regenerated reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: standard-sim-reports
          path: |
            _3_StandardSim/generated_results/*_report_metrics.csv
            _3_StandardSim/generated_results/*_report.pdf
          if-no-files-found: warn
          retention-days: 30
