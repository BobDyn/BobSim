name: CI

on:
  workflow_dispatch:
  # pull_request tests the merge result. push is limited to main to prevent duplicate runs.
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The protect-main ruleset requires these jobs as named status checks.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip -r requirements.txt

      - name: Run ruff
        run: make lint RUN=

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip -r requirements.txt

      - name: Run mypy
        run: make typecheck RUN=

  # Runs natively. Tests that need OpenModelica also need regression artifacts, which CI does not make.
  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip -r requirements.txt

      - name: Run pytest
        run: make test RUN=

  # Checks the user image: it builds, omc works, and the DOE pipeline runs.
  container:
    name: Container toolchain
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The image build is slow, so it runs only for pull requests and main.
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build BobSim image
        run: docker compose build bobsim

      - name: Verify OpenModelica toolchain
        run: docker compose run --rm -T bobsim omc --version

      - name: Check DOE pipeline in-image
        run: make opt-doe-smoke
