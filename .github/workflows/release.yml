name: Release Builds

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version, for example 2026.06.27
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r common/deploy/requirements.txt

      - name: Build and package BobSim
        shell: bash
        run: |
          version="${{ inputs.version }}"
          if [ -z "$version" ] && [[ "$GITHUB_REF_NAME" == v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          fi
          args=(--release --mode onefile)
          if [ -n "$version" ]; then
            args+=(--version "$version")
          fi
          python common/deploy/deploy.py "${args[@]}"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: BobSim-${{ matrix.name }}-${{ runner.arch }}
          path: |
            common/deploy/dist/releases/*.zip
            common/deploy/dist/releases/*.tar.gz
            common/deploy/dist/releases/*.sha256
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Publish assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s globstar nullglob
          files=(release-assets/**/*.{zip,tar.gz,sha256})
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No release files found under release-assets"
            exit 1
          fi
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            version="${GITHUB_REF_NAME#v}"
            gh release create "$GITHUB_REF_NAME" "${files[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --title "BobSim $version" \
              --notes "BobSim desktop release $version."
          fi
