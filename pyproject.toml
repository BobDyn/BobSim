[tool.mypy]
explicit_package_bases = true
ignore_missing_imports = true
files = [
    "common",
    "visualization",
    "engines/kinpy",
    "engines/dynpy",
    "simulations",
    "optimization",
    "app",
    "tests",
]

exclude = '''
(^|/)build/
|(^|/)__pycache__/
|(^|/)\.venv/
|(^|/)engines/boblib/
'''

[[tool.mypy.overrides]]
module = ["vtk.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pyvista.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "engines.kinpy.suspension_model.*",
    "tests.kin_py.*",
]
ignore_errors = true

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
