[tool.mypy]
explicit_package_bases = true
ignore_missing_imports = true
files = [
    "common",
    "visualization",
    "engines/kinpy",
    "engines/dynpy",
    "simulations",
    "optimization",
    "app",
    "tests",
]

exclude = '''
(^|/)build/
|(^|/)__pycache__/
|(^|/)\.venv/
|(^|/)engines/boblib/
'''

[[tool.mypy.overrides]]
module = ["vtk.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pyvista.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "engines.kinpy.suspension_model.*",
    "tests.kin_py.*",
]
ignore_errors = true

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F"]

[tool.ruff.lint.per-file-ignores]
"engines/kinpy/misc_math.py" = ["E501"]
"engines/kinpy/suspension_model/**/*.py" = ["E501", "E711", "E722", "F841"]
"tests/kin_py/**/*.py" = ["E501", "F841"]
