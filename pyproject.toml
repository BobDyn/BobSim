[tool.mypy]
explicit_package_bases = true
ignore_missing_imports = true
files = ["_0_Utils", "_1_VisualSim", "_3_StandardSim", "tests"]

exclude = '''
(^|/)build/
|(^|/)__pycache__/
|(^|/)\.venv/
|(^|/)_0_Utils/external/BobLib/
'''

[[tool.mypy.overrides]]
module = ["vtk.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pyvista.*"]
ignore_missing_imports = true
